name: MorningTV Stream Sentinel Auto-Heal

on:
  schedule:
    # Run every 12 hours automatically (00:00 UTC & 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  audit-and-heal:
    name: Audit & Heal Streams
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run MorningTV Stream Sentinel
        run: |
          node scripts/sync_and_heal.mjs

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/
          if git diff --staged --quiet; then
            echo "No changes in playlist health detected. Everything is up to date."
          else
            git commit -m "chore(sentinel): auto-heal and refresh verified live streams [skip ci]"
            git push
          fi

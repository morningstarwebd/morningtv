name: MorningTV Stream Sentinel & Playlist Auto-Healer (Rust Tokio Engine)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - 'crates/sentinel/**'
      - 'scripts/sync_and_heal.mjs'

permissions:
  contents: write

jobs:
  heal-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sentinel -> target

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run High-Speed Tokio Sentinel Engine (120 Workers)
        run: cargo run --release --manifest-path crates/sentinel/Cargo.toml

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "MorningTV Sentinel Bot"
          git add playlists/
          if git diff --staged --quiet; then
            echo "No stream updates detected. Playlists are already healthy."
          else
            git commit -m "chore(playlists): auto-heal and update verified streams via Rust Tokio Sentinel [skip ci]"
            git push
          fi

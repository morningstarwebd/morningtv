name: MorningTV Stream Sentinel & Playlist Auto-Healer (Rust Tokio Engine)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - 'crates/sentinel/**'

permissions:
  contents: write

jobs:
  heal-and-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sentinel -> target

      - name: Run High-Speed Tokio Sentinel Engine (120 Workers)
        run: cargo run --release --manifest-path crates/sentinel/Cargo.toml

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "MorningTV Sentinel Bot"
          git add playlists/

          # Safety: Ensure channel count didn't drop more than 30%
          NEW_COUNT=$(grep -c "^#EXTINF" playlists/morningtv_all.m3u 2>/dev/null || echo 0)
          OLD_COUNT=$(git show HEAD:playlists/morningtv_all.m3u 2>/dev/null | grep -c "^#EXTINF" || echo 0)

          if [ "$OLD_COUNT" -gt 0 ] && [ "$NEW_COUNT" -lt $((OLD_COUNT * 7 / 10)) ]; then
            echo "Channel count dropped >30% ($OLD_COUNT -> $NEW_COUNT). Aborting auto-push to prevent bad upstream wipe."
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "No stream updates detected. Playlists are already healthy."
          else
            git commit -m "chore(playlists): auto-heal and update verified streams via Rust Tokio Sentinel [skip ci]"
            git push
          fi

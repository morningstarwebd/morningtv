name: MorningTV Stream Sentinel & Playlist Auto-Healer

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - 'scripts/sync_and_heal.mjs'

permissions:
  contents: write

jobs:
  heal-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sentinel & Playlist Aggregator
        run: node scripts/sync_and_heal.mjs

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "MorningTV Sentinel Bot"
          git add playlists/
          if git diff --staged --quiet; then
            echo "No stream updates detected. Playlists are already healthy."
          else
            git commit -m "chore(playlists): auto-heal and update verified streams [skip ci]"
            git push
          fi

name: MorningTV Stream Sentinel & Playlist Auto-Healer (Rust Tokio Engine)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - 'src-tauri/src/bin/sentinel.rs'
      - 'scripts/sync_and_heal.mjs'

permissions:
  contents: write

jobs:
  heal-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run High-Speed Tokio Sentinel Engine (120 Workers)
        run: cargo run --release --manifest-path src-tauri/Cargo.toml --bin sentinel

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "MorningTV Sentinel Bot"
          git add playlists/
          if git diff --staged --quiet; then
            echo "No stream updates detected. Playlists are already healthy."
          else
            git commit -m "chore(playlists): auto-heal and update verified streams via Rust Tokio Sentinel [skip ci]"
            git push
          fi

name: Bug Report
description: Create a report to help us improve MorningTV
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: version
    attributes:
      label: MorningTV Version
      description: What version of MorningTV are you running? (Check Settings HUD or title bar)
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What version of Windows are you running?
      placeholder: e.g. Windows 11 23H2 (build 22631)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open MorningTV
        2. Click on channel '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any console output, logs, or drag images here.

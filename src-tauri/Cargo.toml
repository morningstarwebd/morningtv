[package]
name = "morningtv"
version = "1.0.0"
description = "MorningTV - Native Windows Live TV Player"
authors = ["MorningTV Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
tauri-plugin-single-instance = "2.5"
tiny_http = "0.12.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
sysinfo = { version = "0.36.1", features = ["network"] }


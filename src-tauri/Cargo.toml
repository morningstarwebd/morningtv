[package]
name = "morningtv"
version = "1.1.0"
default-run = "morningtv"
description = "MorningTV Native Windows Live TV Player"
authors = ["MorningTV Team"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "morningtv"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
winreg = "0.55"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
log = "0.4"
tauri-plugin-single-instance = "2.5"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
sysinfo = { version = "0.36.1", features = ["network"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
dirs = "5.0"
dashmap = "6.0"


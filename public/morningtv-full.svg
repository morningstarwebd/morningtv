<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <linearGradient id="mtv-full-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mtv-full-sun" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="mtv-full-m-l" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="mtv-full-m-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <clipPath id="mtv-full-clip">
      <rect x="36" y="56" width="168" height="128" rx="20"/>
    </clipPath>
    <linearGradient id="text-tv-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (x: 20..220, y: 20..220) -->
  <g transform="translate(10, 0)">
    <!-- Antennas -->
    <path d="M 85 35 L 105 60" stroke="url(#mtv-full-bezel)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="82" cy="32" r="5" fill="#38BDF8"/>
    <path d="M 155 35 L 135 60" stroke="url(#mtv-full-m-r)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="32" r="5" fill="#818CF8"/>

    <!-- TV Body -->
    <rect x="28" y="48" width="184" height="144" rx="26" fill="#0A0E1A" stroke="url(#mtv-full-bezel)" stroke-width="5"/>
    <rect x="36" y="56" width="168" height="128" rx="20" fill="#04060C"/>

    <!-- Screen Content -->
    <g clip-path="url(#mtv-full-clip)">
      <circle cx="120" cy="132" r="36" fill="url(#mtv-full-sun)"/>
      <circle cx="120" cy="132" r="20" fill="#FFFBEB" opacity="0.9"/>
      <path d="M 60 162 L 94 92 C 96 87 102 86 106 90 L 120 106 L 105 162 Z" fill="url(#mtv-full-m-l)"/>
      <path d="M 180 162 L 146 92 C 144 87 138 86 134 90 L 120 106 L 135 162 Z" fill="url(#mtv-full-m-r)"/>
      <polygon points="116,116 116,138 134,127" fill="#FFFFFF"/>
      <path d="M 103 76 A 24 24 0 0 1 137 76" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Stand -->
    <rect x="88" y="196" width="64" height="6" rx="3" fill="#0F172A" stroke="url(#mtv-full-bezel)" stroke-width="2"/>
    <circle cx="120" cy="192" r="2" fill="#22D3EE"/>
  </g>

  <!-- Typography: "Morning" + "TV" -->
  <g transform="translate(250, 142)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-1.5">Morning</text>
    <text x="325" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="78" fill="url(#text-tv-grad)" letter-spacing="-1.5">TV</text>
  </g>

  <!-- Live HD Pill Badge -->
  <g transform="translate(680, 78)">
    <rect width="64" height="26" rx="13" fill="#EF4444" fill-opacity="0.95"/>
    <text x="32" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LIVE</text>
  </g>
  <g transform="translate(680, 114)">
    <rect width="64" height="24" rx="12" fill="#06B6D4" fill-opacity="0.2" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="32" y="16.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">4K HDR</text>
  </g>
</svg>

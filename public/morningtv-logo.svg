<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="mtv-ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bezel Gradient (Cyber Metallic Cyan-Blue-Indigo) -->
    <linearGradient id="mtv-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Screen Bevel Rim -->
    <linearGradient id="mtv-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="mtv-screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Dawn Morning Sun Gradient (Vibrant Sunrise) -->
    <linearGradient id="mtv-sun" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="35%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Morning Sun Glow Filter -->
    <filter id="sun-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dynamic "M" Ribbon Left -->
    <linearGradient id="mtv-m-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Dynamic "M" Ribbon Right -->
    <linearGradient id="mtv-m-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="mtv-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for TV Unit -->
    <filter id="tv-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#06B6D4" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#mtv-ambient)"/>

  <!-- TV Antenna Horns (Sleek Geometric Broadcast Wings) -->
  <g filter="url(#tv-shadow)">
    <!-- Left Antenna Rod -->
    <path d="M 186 92 L 236 142" stroke="url(#mtv-bezel)" stroke-width="14" stroke-linecap="round"/>
    <!-- Left Antenna Tip Sphere -->
    <circle cx="180" cy="86" r="11" fill="#38BDF8" filter="drop-shadow(0 0 8px #38BDF8)"/>

    <!-- Right Antenna Rod -->
    <path d="M 326 92 L 276 142" stroke="url(#mtv-m-right)" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Antenna Tip Sphere -->
    <circle cx="332" cy="86" r="11" fill="#818CF8" filter="drop-shadow(0 0 8px #818CF8)"/>
  </g>

  <!-- Main Television Hardware Chassis -->
  <g filter="url(#tv-shadow)">
    <!-- Outer TV Bezel with Cyber Neon Stroke -->
    <rect x="52" y="132" width="408" height="312" rx="54" fill="#0A0E1A" stroke="url(#mtv-bezel)" stroke-width="10"/>

    <!-- Inner Metallic Rim -->
    <rect x="64" y="144" width="384" height="288" rx="44" fill="none" stroke="url(#mtv-rim)" stroke-width="2.5"/>

    <!-- Display Screen Glass Surface -->
    <rect x="68" y="148" width="376" height="280" rx="40" fill="url(#mtv-screen-bg)"/>

    <!-- Diagonal Glass Glare Sweep -->
    <path d="M 68 188 Q 256 160 444 260 L 444 148 Q 444 148 408 148 L 108 148 Q 68 148 68 188 Z" fill="url(#mtv-glare)"/>
  </g>

  <!-- Screen Content: Sunrise & Geometric "M" Crest -->
  <g id="screen-artwork">
    <!-- Clip path to keep artwork inside screen glass -->
    <clipPath id="screen-clip">
      <rect x="70" y="150" width="372" height="276" rx="38"/>
    </clipPath>

    <g clip-path="url(#screen-clip)">
      <!-- Horizon Atmospheric Dawn Haze -->
      <ellipse cx="256" cy="380" rx="200" ry="110" fill="#EA580C" opacity="0.35" filter="blur(30px)"/>
      <ellipse cx="256" cy="330" rx="140" ry="80" fill="#F97316" opacity="0.45" filter="blur(20px)"/>

      <!-- Rising Morning Sun Disk with Radiant Solar Flare -->
      <circle cx="256" cy="315" r="76" fill="url(#mtv-sun)" filter="url(#sun-glow)"/>

      <!-- Inner Sun Core Light -->
      <circle cx="256" cy="315" r="42" fill="#FFFBEB" opacity="0.85" filter="blur(6px)"/>

      <!-- The Iconic "M" Broadcast Ribbon (Morning Crest) -->
      <!-- Left Leg & Peak of M -->
      <path d="M 124 380 L 198 226 C 203 216 215 214 223 222 L 256 256 L 222 380 Z" 
            fill="url(#mtv-m-left)" 
            filter="drop-shadow(0 6px 14px rgba(6, 182, 212, 0.6))"/>

      <!-- Right Peak & Leg of M -->
      <path d="M 388 380 L 314 226 C 309 216 297 214 289 222 L 256 256 L 290 380 Z" 
            fill="url(#mtv-m-right)" 
            filter="drop-shadow(0 6px 14px rgba(99, 102, 241, 0.6))"/>

      <!-- Center Live Signal Play Beacon (White / Cyan Diamond Arrow) -->
      <g filter="drop-shadow(0 0 12px rgba(255, 255, 255, 0.95))">
        <polygon points="248,276 248,324 286,300" fill="#FFFFFF"/>
      </g>

      <!-- Broadcast Arc Waves Emanating from Top of M -->
      <path d="M 218 190 A 52 52 0 0 1 294 190" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M 200 172 A 76 76 0 0 1 312 172" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.7"/>
    </g>
  </g>

  <!-- TV Bottom Stand Base & Power Indicator -->
  <g>
    <!-- Stand Neck -->
    <path d="M 234 444 L 278 444 L 286 466 L 226 466 Z" fill="#182032" stroke="#2563EB" stroke-width="2"/>
    <!-- Stand Wide Base -->
    <rect x="180" y="466" width="152" height="14" rx="7" fill="#0F172A" stroke="url(#mtv-bezel)" stroke-width="3"/>
    <!-- Active Green / Cyan Status LED -->
    <circle cx="256" cy="436" r="3.5" fill="#22D3EE" filter="drop-shadow(0 0 5px #22D3EE)"/>
  </g>
</svg>

[package]
name = "sentinel"
version = "1.0.0"
edition = "2021"
description = "MorningTV Stream Sentinel: High-Speed Tokio Live Stream Auditor"
authors = ["MorningTV Team"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
